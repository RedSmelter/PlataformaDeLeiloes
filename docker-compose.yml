services:
  postgres:
    image: postgres:16-alpine
    container_name: leiloes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leiloes
      POSTGRES_PASSWORD: leiloes
      POSTGRES_DB: leiloes
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/infrastructure/database/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: leiloes-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  post-auction-service:
    build:
      context: ./services/post-auction-service
    container_name: leiloes-post-auction-service
    restart: unless-stopped
    environment:
      PORT: 50051

  traefik:
    image: traefik:v3.5
    container_name: leiloes-traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.56
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:3000"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://leiloes:leiloes@postgres:5432/leiloes
      REDIS_URL: redis://redis:6379
      JWT_SECRET: troque_essa_chave_antes_de_ir_pra_producao
      POST_AUCTION_SERVICE_URL: post-auction-service:50051
      PORT: 3000
    depends_on:
      - postgres
      - redis
      - post-auction-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: leiloes-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  autoscaler:
    build:
      context: ./autoscaler
    container_name: leiloes-autoscaler
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    environment:
      COMPOSE_PROJECT_NAME: auction-platform
      MIN_REPLICAS: "2"
      MAX_REPLICAS: "3"
      SCALE_UP_THRESHOLD: "50"
      SCALE_DOWN_THRESHOLD: "30"
      CHECK_INTERVAL_SECONDS: "3"
    depends_on:
      - backend

volumes:
  postgres_data:
services:
  postgres:
    image: postgres:16-alpine
    container_name: leiloes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leiloes
      POSTGRES_PASSWORD: leiloes
      POSTGRES_DB: leiloes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: